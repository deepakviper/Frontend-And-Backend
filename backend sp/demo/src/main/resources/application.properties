spring.application.name=demo

# Set the server port and host address
server.port=${PORT:8080}
server.address=0.0.0.0

# Increase maximum file upload sizes for large patent drafts (50,000+ chars / 50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallowed-request-bytes=50MB
